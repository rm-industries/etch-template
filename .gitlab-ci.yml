# Start with Linux container runners; add other OS runners only when you have them.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GIT_SUBMODULE_STRATEGY: recursive

compatibility:
  image: python:${PYTHON_VERSION}
  timeout: 10 minutes
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.9', '3']
  script:
    - |
      set -euo pipefail
      ci_home=$(mktemp -d)
      trap 'rm -rf -- "$ci_home"' EXIT

      # Match dotfiles: verify this consumer's profile in an isolated user home.
      env HOME="$ci_home" ./etch format --check
      env HOME="$ci_home" ./etch validate
      env HOME="$ci_home" ./etch doctor --profile developer
      env HOME="$ci_home" ./etch plan --profile developer
      env HOME="$ci_home" ./etch apply --profile developer
