name: Validate configuration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: ${{ matrix.os }} / ${{ matrix.selection }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        selection: ['--profile developer', 'git']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Apply and verify the selected configuration
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
          ETCH_SELECTION: ${{ matrix.selection }}
        run: |
          mkdir -p "$HOME"
          read -r -a selection <<< "$ETCH_SELECTION"
          ./etch plan "${selection[@]}"
          ./etch apply "${selection[@]}"
          ./etch doctor "${selection[@]}"

          # Assert the state this starter actually promises.
          test -L "$HOME/.gitconfig"
          test "$(readlink "$HOME/.gitconfig")" = "$GITHUB_WORKSPACE/modules/git/files/gitconfig"
          test "$(git config --file "$HOME/.gitconfig" --get init.defaultBranch)" = main

          ./etch apply "${selection[@]}" | tee "$RUNNER_TEMP/etch-second-apply.log"
          if grep -Eq '^(CHANGED|FAILED|BLOCKED) ' "$RUNNER_TEMP/etch-second-apply.log"; then
            echo "Second apply did not preserve the expected declarative state." >&2
            exit 1
          fi
