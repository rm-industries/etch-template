name: Etch compatibility

on:
  push:
    branches: [main]
    paths:
      - etch
      - defaults.conf
      - modules/**
      - profiles/**
      - vendor/etch
      - .gitmodules
      - .github/workflows/etch.yml
  pull_request:
    branches: [main]
    paths:
      - etch
      - defaults.conf
      - modules/**
      - profiles/**
      - vendor/etch
      - .gitmodules
      - .github/workflows/etch.yml
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Apply developer profile
        shell: bash
        env:
          HOME: ${{ runner.temp }}/etch-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./etch format --check
          ./etch validate
          ./etch plan --profile developer
          ./etch apply --profile developer
          ./etch doctor --profile developer

          # Verify the starter's promised Git configuration.
          test -L "$HOME/.gitconfig"
          test "$(readlink "$HOME/.gitconfig")" = "$GITHUB_WORKSPACE/modules/git/files/gitconfig"
          test "$(git config --file "$HOME/.gitconfig" --get init.defaultBranch)" = main

          ./etch apply --profile developer | tee "$RUNNER_TEMP/etch-second-apply.log"
          if grep -Eq '^[[:space:]]*(CHANGED|FAILED|BLOCKED)([[:space:]]|$)' "$RUNNER_TEMP/etch-second-apply.log"; then
            echo "Second apply did not preserve the expected declarative state." >&2
            exit 1
          fi
