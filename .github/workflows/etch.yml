name: Etch compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Apply developer profile
        shell: bash
        run: |
          set -euo pipefail
          ci_home=$(mktemp -d)
          trap 'rm -rf -- "$ci_home"' EXIT

          # Prepare optional macOS tooling without making Homebrew a prerequisite.
          if [[ "$(uname -s)" == Darwin ]]; then
            export HOMEBREW_CASK_OPTS="--appdir=$ci_home/apps"
            mkdir -p "$ci_home/apps"
            brew_bin=$(command -v brew || true)
            if [[ -z "$brew_bin" ]]; then
              for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
                if [[ -x "$candidate" ]]; then
                  brew_bin=$candidate
                  break
                fi
              done
            fi
            if [[ -n "$brew_bin" ]]; then
              eval "$("$brew_bin" shellenv)"
            fi
          fi

          # Match dotfiles: verify this consumer's profile in an isolated user home.
          env HOME="$ci_home" ./etch format --check
          env HOME="$ci_home" ./etch validate
          env HOME="$ci_home" ./etch doctor --profile developer
          env HOME="$ci_home" ./etch plan --profile developer
          env HOME="$ci_home" ./etch apply --profile developer

  windows-compatibility:
    name: Windows / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Windows launchers and second apply
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'etch-consumer-home'
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          foreach ($arguments in @(
            @('format', '--check'), @('validate'),
            @('doctor', '--profile', 'developer'),
            @('plan', '--profile', 'developer'),
            @('apply', '--profile', 'developer')
          )) {
            & .\etch.cmd @arguments
            if ($LASTEXITCODE -ne 0) { throw "Etch failed: $arguments" }
          }
          $launcher = Join-Path $env:USERPROFILE '.local/bin/etch.cmd'
          Push-Location $env:RUNNER_TEMP
          try {
            & $launcher plan --profile developer
            if ($LASTEXITCODE -ne 0) { throw 'Linked launcher plan failed' }
            $second = & $launcher apply --profile developer
            if ($LASTEXITCODE -ne 0) { throw 'Second apply failed' }
            if ($second -match '^\s*(CHANGED|FAILED|BLOCKED)') {
              throw "Second apply was not unchanged: $second"
            }
          } finally {
            Pop-Location
          }
